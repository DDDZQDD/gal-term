<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <title>Admin GAL — solo équipes</title>
    <link rel="stylesheet" href="deck.css" />
    <style>
      .admin { max-width: 1180px; margin: 0 auto; padding: 18px 16px 48px; display: grid; gap: 16px; }
      .admin h1 { margin: 0; color: #fbbf24; letter-spacing: .08em; }
      .admin .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
      .admin table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .admin th, .admin td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
      .admin th { color: var(--muted); font-weight: 600; }
      .admin .num { text-align: right; white-space: nowrap; }
      .who { display: flex; flex-wrap: wrap; gap: 6px; }
      .meta { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="admin.js"></script>
  </body>
</html>
